[project]
name = "jet"
version = "0.1.0"
description = "Fast TUI text editor with mouse, file tree, syntax highlighting, autoindent and autoclose. Python-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge" }]
dependencies = [
    "textual[syntax]>=0.85",
    "pathspec>=0.12",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jet = "jet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jet"]
